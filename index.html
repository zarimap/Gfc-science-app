<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学部 予定管理</title>
    <!-- FullCalendar v6 -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 10px; 
            background-color: #f0f2f5; 
            color: #333; 
        }
        #calendar { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white; 
            padding: 10px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            min-height: 400px; 
        }
        
        .form-container {
            max-width: 900px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .form-container h2 { margin-top: 0; font-size: 1.2rem; }
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:active { background-color: #0056b3; }
        
        h1 { text-align: center; font-size: 1.5rem; }
    </style>
</head>
<body>

    <h1>🧪 科学部 予定管理</h1>

    <div id='calendar'></div>

    <div class="form-container">
        <h2>📅 予定を追加する</h2>
        <input type="text" id="eventTitle" placeholder="予定の名前（例：実験A）">
        <input type="date" id="eventDate">
        <button id="addBtn">カレンダーに追加</button>
    </div>

    <script>
      // ==========================================
      // 1. GAS 通信ラッパー関数
      // ==========================================
      const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxlFIYrp2JuigWirQ6aGd0SrDjrQOWcZ3KooV5esH-6DqQL-fAtk5tTwi387J6p_fQAQA/exec';

      async function callGasApi(options = {}) {
        const url = options.url || GAS_WEB_APP_URL;
        const method = options.method || 'GET';
        
        let fetchOptions = {
          method: method,
          redirect: 'follow'
        };

        if (method === 'POST') {
          fetchOptions.body = JSON.stringify(options.body || {});
          fetchOptions.headers = {
            'Content-Type': 'text/plain;charset=utf-8'
          };
        }

        const response = await fetch(url, fetchOptions);
        if (!response.ok) {
          throw new Error(`HTTP Error Status: ${response.status}`);
        }
        
        return await response.json();
      }

      // ==========================================
      // 2. カレンダー & CRUD処理
      // ==========================================
      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var eventTitleInput = document.getElementById('eventTitle');
        var eventDateInput = document.getElementById('eventDate');
        var addBtn = document.getElementById('addBtn');

        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: 'ja',
          headerToolbar: {
            left: 'prev,next',
            center: 'title',
            right: 'today'
          },
          events: async function(fetchInfo, successCallback, failureCallback) {
            try {
              const data = await callGasApi();

              if (data.error) {
                throw new Error(data.error);
              }

              if (!Array.isArray(data)) {
                throw new Error('受領したデータが配列形式ではありません');
              }

              const events = data.map(event => ({
                id: event.id,
                title: event.title,
                start: event.start,
                allDay: event.all_day
              }));

              successCallback(events);
            } catch (err) {
              console.error('取得エラー:', err.message);
              alert('予定の取得に失敗しました');
              successCallback([]);
            }
          },
          eventClick: async function(info) {
            if (confirm('「' + info.event.title + '」を削除しますか？')) {
              try {
                const result = await callGasApi({
                  method: 'POST',
                  body: { action: 'delete', id: info.event.id }
                });

                if (result.error) throw new Error(result.error);

                info.event.remove();
                alert('削除しました！');
              } catch (err) {
                console.error('削除失敗:', err.message);
                alert('削除に失敗しました');
              }
            }
          }
        });

        calendar.render();

        addBtn.addEventListener('click', async function() {
          var title = eventTitleInput.value;
          var date = eventDateInput.value;

          if (title && date) {
            try {
              const data = await callGasApi({
                method: 'POST',
                body: {
                  action: 'insert',
                  data: [{ title: title, start: date, all_day: true }]
                }
              });

              if (data.error) throw new Error(data.error);

              if (Array.isArray(data) && data.length > 0) {
                calendar.addEvent({
                  id: data[0].id,
                  title: data[0].title,
                  start: data[0].start,
                  allDay: data[0].all_day
                });

                eventTitleInput.value = '';
                eventDateInput.value = '';
                alert('追加しました！');
              }
            } catch (err) {
              console.error('追加失敗:', err.message);
              alert('追加に失敗しました');
            }
          } else {
            alert('タイトルと日付を入力してください');
          }
        });
      });
    </script>
</body>
</html>
