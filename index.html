<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学部 予定管理</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        body { font-family: sans-serif; margin: 10px; background-color: #f0f2f5; }
        #calendar { max-width: 900px; margin: 20px auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; font-size: 1.5rem; }
        /* タブレットでも操作しやすいように少し大きめに */
        .fc-event { cursor: pointer; padding: 2px 5px; }
    </style>
</head>
<body>

    <h1>🧪 科学部 予定・タスク管理</h1>
    <div id='calendar'></div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');

        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: 'ja',
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
          },
          editable: true, // ドラッグ＆ドロップを許可
          selectable: true, // 日付選択を許可

          // --- 1. 予定の追加 ---
          select: function(info) {
            var title = prompt('予定のタイトルを入力してください:');
            if (title) {
              var newEvent = {
                title: title,
                start: info.startStr,
                end: info.endStr,
                allDay: info.allDay
              };
              calendar.addEvent(newEvent);
              saveEvents(); // 保存
            }
            calendar.unselect();
          },

          // --- 2. 予定の削除 ---
          eventClick: function(info) {
            if (confirm('この予定「' + info.event.title + '」を削除しますか？')) {
              info.event.remove();
              saveEvents(); // 保存
            }
          },

          // --- 3. データの読み込み ---
          events: JSON.parse(localStorage.getItem('clubEvents')) || []
        });

        calendar.render();

        // --- 4. データをブラウザに保存する関数 ---
        function saveEvents() {
          var events = calendar.getEvents().map(function(e) {
            return {
              title: e.title,
              start: e.startStr,
              end: e.endStr,
              allDay: e.allDay
            };
          });
          localStorage.setItem('clubEvents', JSON.stringify(events));
        }
      });
    </script>
</body>
</html>
